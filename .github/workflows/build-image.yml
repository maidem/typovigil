name: Build and Push Docker Image to GHCR

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=ref,event=branch
                      type=sha,prefix={{branch}}-
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  # amd64 only: the target server is x86_64, and emulating arm64
                  # triples the build time for nothing.
                  platforms: linux/amd64
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=min
                  provenance: false

    notify-coolify:
        needs: build-and-push
        runs-on: ubuntu-latest
        if: ${{ github.ref == 'refs/heads/main' }}
        steps:
            # Coolify only listens inside the tailnet, so the runner joins it first.
            - name: Connect to Tailscale
              uses: tailscale/github-action@v3
              with:
                  oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
                  oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
                  tags: tag:ci
                  use-cache: true

            - name: Trigger Coolify deployment
              env:
                  WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
                  WEBHOOK_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
              run: |
                  # Placeholder secrets are expected until the Tailscale credentials
                  # are filled in; skip rather than fail the whole workflow.
                  case "$WEBHOOK_TOKEN" in
                      ''|CHANGEME*)
                          echo "Coolify secrets not set yet - skipping deploy."
                          exit 0
                          ;;
                  esac
                  curl --silent --show-error --fail-with-body \
                    --retry 3 --retry-all-errors \
                    --request POST \
                    --url "$WEBHOOK_URL" \
                    --header "Authorization: Bearer $WEBHOOK_TOKEN" \
                    --write-out "HTTP Status: %{http_code}\n"
