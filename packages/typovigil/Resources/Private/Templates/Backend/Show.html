<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Module" />

<f:section name="Content">
    <h1>{project.title}</h1>

    <p>
        <f:link.action action="index" class="btn btn-default"><f:translate key="backend.allProjects" /></f:link.action>
        <f:link.action action="checkNow" arguments="{project: project.uid, returnTo: 'show'}" class="btn btn-default">
            <f:translate key="backend.checkNow" />
        </f:link.action>
    </p>

    <f:if condition="{project.isStale}">
        <div class="callout callout-warning">
            <p>
                <strong><f:translate key="backend.projectStaleWarning" /></strong>
                <f:translate key="backend.projectStaleWarningHint" />
            </p>
        </div>
    </f:if>

    <dl class="row">
        <dt class="col-sm-3"><f:translate key="backend.coreVersion" /></dt>
        <dd class="col-sm-9">{project.coreVersion}</dd>
        <dt class="col-sm-3"><f:translate key="backend.lastReport" /></dt>
        <dd class="col-sm-9">
            <f:if condition="{project.hasReported}">
                <f:then><f:format.date format="d.m.Y H:i">{project.lastReportAt}</f:format.date></f:then>
                <f:else><f:translate key="backend.never" /></f:else>
            </f:if>
        </dd>
        <dt class="col-sm-3"><f:translate key="backend.updatesAvailable" /></dt>
        <dd class="col-sm-9"><f:translate key="backend.updatesAvailableCount" arguments="{0: project.updatesAvailable, 1: project.packageCount}" /></dd>

        <f:if condition="{project.coolifyApplicationUuid}">
            <dt class="col-sm-3"><f:translate key="backend.lastBackup" /></dt>
            <dd class="col-sm-9">
                <f:if condition="{project.lastBackupAt}">
                    <f:then>
                        <f:format.date format="d.m.Y H:i">{project.lastBackupAt}</f:format.date>
                        (<code>{project.lastBackupStatus}</code>)
                    </f:then>
                    <f:else><f:translate key="backend.never" /></f:else>
                </f:if>
                <p class="text-muted"><small><f:translate key="backend.backupHint" arguments="{0: project.uid}" /></small></p>
            </dd>
        </f:if>
    </dl>

    <f:if condition="{project.packages}">
        <f:then>
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th><f:translate key="backend.packages" /></th>
                        <th><f:translate key="backend.installed" /></th>
                        <th><f:translate key="backend.available" /></th>
                        <th><f:translate key="backend.status" /></th>
                    </tr>
                </thead>
                <tbody>
                    <f:for each="{project.packages}" as="package">
                        <tr>
                            <td>
                                <f:if condition="{package.composer_name}">
                                    <f:then>{package.composer_name}</f:then>
                                    <f:else>{package.extension_key}</f:else>
                                </f:if>
                                <f:if condition="{package.is_core}">
                                    <span class="badge bg-info">core</span>
                                </f:if>
                            </td>
                            <td>{package.installed_version}</td>
                            <td>
                                <f:if condition="{package.latest_version}">
                                    <f:then>{package.latest_version}</f:then>
                                    <f:else><span class="text-muted"><f:translate key="backend.unknown" /></span></f:else>
                                </f:if>
                            </td>
                            <td>
                                <f:switch expression="{package.severity}">
                                    <f:case value="critical">
                                        <span class="badge bg-danger"><f:translate key="backend.security" /></span>
                                    </f:case>
                                    <f:case value="outdated">
                                        <span class="badge bg-warning text-dark"><f:translate key="backend.outdatedBadge" /></span>
                                    </f:case>
                                    <f:defaultCase>
                                        <span class="badge bg-success"><f:translate key="backend.ok" /></span>
                                    </f:defaultCase>
                                </f:switch>
                            </td>
                        </tr>
                        <f:if condition="{package.ai_report_text}">
                            <tr>
                                <td colspan="4">
                                    <div class="callout callout-info">
                                        <p>
                                            <strong><f:translate key="backend.aiReport" /></strong>
                                            <span class="badge bg-secondary">{package.ai_report_status}</span>
                                        </p>
                                        <p>{package.ai_report_text}</p>
                                    </div>
                                </td>
                            </tr>
                        </f:if>
                    </f:for>
                </tbody>
            </table>
        </f:then>
        <f:else>
            <div class="callout callout-info">
                <p><f:translate key="backend.noPackagesYet" /></p>
            </div>
        </f:else>
    </f:if>
</f:section>

</html>
