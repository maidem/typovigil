services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Maidemde\Typovigil\:
    resource: '../Classes/*'

  # Scheduler tasks resolve these from the container themselves, which only works
  # for services that are public.
  Maidemde\Typovigil\Domain\Repository\ProjectRepository:
    public: true

  Maidemde\Typovigil\Service\SeverityResolver:
    public: true

  Maidemde\Typovigil\Service\StatusReportService:
    public: true

  Maidemde\Typovigil\Service\UpdateChecker:
    public: true

  # The DataHandler hook resolves this via GeneralUtility::makeInstance, which
  # only works for services that are public.
  Maidemde\Typovigil\Service\ProjectTokenService:
    public: true

  cache.typovigil:
    class: 'TYPO3\CMS\Core\Cache\Frontend\FrontendInterface'
    factory: ['@TYPO3\CMS\Core\Cache\CacheManager', 'getCache']
    arguments:
      $identifier: 'typovigil'

  Maidemde\Typovigil\Service\VersionCheckService:
    public: true
    arguments:
      $cache: '@cache.typovigil'

  Maidemde\Typovigil\Service\CliCommandService:
    public: true
    arguments:
      $cache: '@cache.typovigil'

  Maidemde\Typovigil\Command\CheckUpdatesCommand:
    tags:
      - name: 'console.command'
        command: 'typovigil:check'
        description: 'Match reported packages against the upstream sources'

  Maidemde\Typovigil\Command\BackupBeforeUpdateCommand:
    tags:
      - name: 'console.command'
        command: 'typovigil:backup'
        description: 'Back a project up on Coolify before applying an update'

  Maidemde\Typovigil\Command\CheckAndAnalyzeCommand:
    tags:
      - name: 'console.command'
        command: 'typovigil:check-and-analyze'
        description: 'Run the update check and generate an AI risk report for each critical package'

  # Own table (tx_typovigil_backup_queue) rather than core's default
  # sys_messenger_messages: TYPO3 only auto-creates that one via database
  # compare, a custom table_name needs its own ext_tables.sql entry, which
  # this has.
  messenger.transport.backup:
    factory: ['@TYPO3\CMS\Core\Messenger\DoctrineTransportFactory', 'createTransport']
    class: 'Symfony\Component\Messenger\Bridge\Doctrine\Transport\DoctrineTransport'
    arguments:
      $options:
        table_name: 'tx_typovigil_backup_queue'
    tags:
      - name: 'messenger.sender'
        identifier: 'backup'
      - name: 'messenger.receiver'
        identifier: 'backup'
