services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Maidemde\Typovigil\:
    resource: '../Classes/*'

  # Scheduler tasks resolve these from the container themselves, which only works
  # for services that are public.
  Maidemde\Typovigil\Domain\Repository\ProjectRepository:
    public: true

  Maidemde\Typovigil\Service\SeverityResolver:
    public: true

  Maidemde\Typovigil\Service\StatusReportService:
    public: true

  Maidemde\Typovigil\Service\UpdateChecker:
    public: true

  cache.typovigil:
    class: 'TYPO3\CMS\Core\Cache\Frontend\FrontendInterface'
    factory: ['@TYPO3\CMS\Core\Cache\CacheManager', 'getCache']
    arguments:
      $identifier: 'typovigil'

  Maidemde\Typovigil\Service\VersionCheckService:
    public: true
    arguments:
      $cache: '@cache.typovigil'

  Maidemde\Typovigil\Command\CheckUpdatesCommand:
    tags:
      - name: 'console.command'
        command: 'typovigil:check'
        description: 'Match reported packages against the upstream sources'
