services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Maidemde\TypovigilSitepackage\:
    resource: '../Classes/*'

  Maidemde\TypovigilSitepackage\Command\SeedLegalPagesCommand:
    tags:
      - name: 'console.command'
        command: 'typovigilsitepackage:seed-legal-pages'
        description: 'Creates the Impressum and Datenschutzerklärung pages if they do not exist yet'

  Maidemde\TypovigilSitepackage\Command\OpenStatusPageCommand:
    tags:
      - name: 'console.command'
        command: 'typovigilsitepackage:open-status-page'
        description: 'Removes the login-only restriction from the /status page'

  Maidemde\TypovigilSitepackage\Command\MoveContentToRootPageCommand:
    tags:
      - name: 'console.command'
        command: 'typovigilsitepackage:move-content-to-root'
        description: 'Moves the portal plugin content element to the root page'
