styles.templates.layoutRootPath: 'EXT:typovigil_sitepackage/Resources/Private/ContentElements/Layouts/'
styles.templates.partialRootPath: 'EXT:typovigil_sitepackage/Resources/Private/ContentElements/Partials/'
styles.templates.templateRootPath: 'EXT:typovigil_sitepackage/Resources/Private/ContentElements/Templates/'

page.pageview.paths: 'EXT:typovigil_sitepackage/Resources/Private/PageView/'

page.meta.viewport: 'width=device-width, initial-scale=1'
page.meta.robots: 'index,follow'
page.meta.apple-mobile-web-app-capable: 'no'
page.meta.compatible: 'IE=edge'

page.tracking.google.trackingID: ''
page.tracking.google.anonymizeIp: '1'

config.no_cache: '0'
config.removeDefaultJS: '0'
config.admPanel: '1'
config.prefixLocalAnchors: 'all'
config.headerComment: 'build by get.typo3.org/sitepackage'
config.sendCacheHeaders: '1'

# The portal plugin (project overview) lives on the root page (1), not on
# "Status" (3) anymore — see MoveContentToRootPageCommand. Both login and
# logout now send visitors there; "Status" is a leftover page with no content
# on it.
felogin.redirectMode: 'login,logout'
felogin.redirectPageLogin: 1
felogin.redirectPageLogout: 1
felogin.redirectDisable: false
