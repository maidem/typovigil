<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:tv="http://typo3.org/ns/Maidemde/TypovigilSitepackage/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <div class="tv-portal tv-security-sources">
        <f:if condition="{data.heading}">
            <f:if condition="{data.heading_level} == 'h1'">
                <f:then><h1 class="tv-portal__heading">{data.heading}</h1></f:then>
                <f:else><h2 class="tv-portal__heading">{data.heading}</h2></f:else>
            </f:if>
        </f:if>

        <f:if condition="{data.sources}">
            <f:then>
                <f:variable name="advisories" value="{tv:securitySources(sources: data.sources)}" />

                <f:if condition="{advisories}">
                    <f:then>
                        <!-- Alle Advisories kommen mit; Filter und Pagination laufen
                             client-seitig (main.js) ohne Seiten-Reload. -->
                        <div class="tv-filter" data-tv-advisory-filter>
                            <button type="button" class="tv-filter__pill is-active" data-tv-advisory-type="all">Alle</button>
                            <button type="button" class="tv-filter__pill" data-tv-advisory-type="critical">Kritisch</button>
                            <button type="button" class="tv-filter__pill" data-tv-advisory-type="high">Hoch</button>
                            <button type="button" class="tv-filter__pill" data-tv-advisory-type="medium">Mittel</button>
                            <button type="button" class="tv-filter__pill" data-tv-advisory-type="low">Niedrig</button>
                        </div>

                        <div class="tv-list" data-tv-advisory-list>
                            <f:for each="{advisories}" as="advisory">
                                <div class="tv-list__row" data-tv-advisory-type="{advisory.severity}">
                                    <span class="tv-chip tv-chip--{f:if(condition: '{advisory.severity} == \'critical\' || {advisory.severity} == \'high\'', then: 'critical', else: 'outdated')}">
                                        <f:switch expression="{advisory.severity}">
                                            <f:case value="critical">Kritisch</f:case>
                                            <f:case value="high">Hoch</f:case>
                                            <f:case value="medium">Mittel</f:case>
                                            <f:case value="low">Niedrig</f:case>
                                            <f:defaultCase>Unbekannt</f:defaultCase>
                                        </f:switch>
                                    </span>

                                    <a class="tv-list__title" href="{advisory.link}" target="_blank" rel="noopener">{advisory.title}</a>

                                    <span class="tv-list__meta">{advisory.source} &middot; {advisory.id} &middot; <f:format.date format="d.m.Y">{advisory.date}</f:format.date></span>
                                </div>
                            </f:for>
                        </div>

                        <p class="tv-empty tv-empty--filtered" data-tv-advisory-empty hidden>
                            Keine Security Advisories in dieser Auswahl.
                        </p>

                        <div data-tv-advisory-pagination></div>
                    </f:then>
                    <f:else>
                        <p class="tv-empty">Security Advisories derzeit nicht verfügbar.</p>
                    </f:else>
                </f:if>
            </f:then>
            <f:else>
                <p class="tv-empty">Keine Quellen hinterlegt.</p>
            </f:else>
        </f:if>
    </div>
</html>
