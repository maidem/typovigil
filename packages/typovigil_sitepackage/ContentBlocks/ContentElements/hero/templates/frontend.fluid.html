<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <div class="tv-portal tv-hero">
        <article class="tv-card tv-hero__card">
            <header class="tv-card__head">
                <f:if condition="{data.teaser}">
                    <span class="tv-hero__teaser">{data.teaser}</span>
                </f:if>
            </header>
            <!-- Architektur ändert sich nicht redaktionell, daher fest
                 verdrahtet statt eigenes Feld/DB-Anbindung wie in portfolio-v10.
                 JSON steht als <script type="application/json">, nicht als
                 Fluid-String: geschweifte Klammern im JSON würden sonst als
                 Fluid-Ausdrücke geparst. -->
            <script type="application/json" id="c{data.uid}-metro">
                {"nodes":{"agent":{"label":"Agent-Extension\nje Installation","col":0,"row":0},"hub":{"label":"TypoVigil-Hub\nReport · HTTPS","col":1,"row":0},"sources":{"label":"get.typo3.org\nPackagist · Advisories","col":2,"row":2},"status":{"label":"Statusübersicht\naktuell · veraltet","col":2,"row":0},"customer":{"label":"Kundenlogin\nFrontend","col":3,"row":0}},"edges":[{"from":"agent","to":"hub","color":"#1c8a7d"},{"from":"hub","to":"sources","color":"#e8590c"},{"from":"sources","to":"status","color":"#e8590c"},{"from":"hub","to":"status","color":"#1c8a7d"},{"from":"status","to":"customer","color":"#1c8a7d"}]}
            </script>
            <div class="tv-metro tv-hero__metro" data-metro-src="c{data.uid}-metro"></div>
        </article>
    </div>
</html>
