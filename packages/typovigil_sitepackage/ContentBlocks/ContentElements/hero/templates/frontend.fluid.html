<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <div class="tv-portal tv-hero">
        <f:if condition="{data.teaser}">
            <h1 class="tv-hero__teaser">{data.teaser}</h1>
        </f:if>
        <article class="tv-card tv-hero__card">
            <header class="tv-card__head">
                <span class="tv-chip tv-chip--ok">Live-Überwachung</span>
            </header>
            <!-- JSON steht als <script type="application/json">, nicht als
                 Fluid-String: geschweifte Klammern im JSON würden sonst als
                 Fluid-Ausdrücke geparst. f:format.raw ist hier sicher, weil
                 metro_json ein Redakteursfeld ist, kein User-Input. -->
            <script type="application/json" id="c{data.uid}-metro"><f:format.raw>{data.metro_json}</f:format.raw></script>
            <div class="tv-metro tv-hero__metro" data-metro-src="c{data.uid}-metro"></div>
        </article>
    </div>
</html>
