<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<!-- No f:layout: Layouts/ holds page layouts only, and a plugin rendered into a
     content element brings its own markup. -->
<div class="tv-portal">
    <div class="tv-cards">
        <f:for each="{coreVersions}" as="core">
            <article class="tv-card tv-card--{core.severity}">
                <header class="tv-card__head">
                    <span class="tv-chip tv-chip--{core.severity}">{core.severityLabel}</span>
                </header>
                <h2 class="tv-card__title">TYPO3 {core.major}</h2>
                <p class="tv-lead">Neueste Version: {core.version}</p>
            </article>
        </f:for>
    </div>

    <h2 class="tv-portal__heading tv-portal__heading--spaced">Security Advisories</h2>

    <f:if condition="{advisories}">
        <f:then>
            <!-- Alle Advisories kommen mit; Filter und Pagination laufen
                 client-seitig (security.js) ohne Seiten-Reload. -->
            <div class="tv-filter" data-tv-advisory-filter>
                <button type="button" class="tv-filter__pill is-active" data-tv-advisory-type="all">Alle</button>
                <button type="button" class="tv-filter__pill" data-tv-advisory-type="core">TYPO3 Core</button>
                <button type="button" class="tv-filter__pill" data-tv-advisory-type="extension">Extensions</button>
            </div>

            <div class="tv-cards tv-cards--advisories" data-tv-advisory-list>
                <f:for each="{advisories}" as="advisory">
                    <article class="tv-card tv-card--{f:if(condition: '{advisory.type} == \'core\'', then: 'critical', else: 'outdated')}" data-tv-advisory-type="{advisory.type}">
                        <header class="tv-card__head">
                            <span class="tv-chip tv-chip--{f:if(condition: '{advisory.type} == \'core\'', then: 'critical', else: 'outdated')}">
                                <f:if condition="{advisory.type} == 'core'">
                                    <f:then>TYPO3 Core</f:then>
                                    <f:else>Extension</f:else>
                                </f:if>
                            </span>
                        </header>

                        <h2 class="tv-card__title">
                            <a href="{advisory.link}" target="_blank" rel="noopener">{advisory.title}</a>
                        </h2>

                        <p class="tv-lead">{advisory.description}</p>

                        <div class="tv-card__foot">
                            <span class="tv-card__more">{advisory.id} &middot; <f:format.date format="d.m.Y">{advisory.date}</f:format.date></span>
                        </div>
                    </article>
                </f:for>
            </div>

            <p class="tv-empty tv-empty--filtered" data-tv-advisory-empty hidden>
                Keine Security Advisories in dieser Auswahl.
            </p>

            <div class="tv-back" data-tv-advisory-pagination></div>
        </f:then>
        <f:else>
            <p class="tv-empty">Security Advisories derzeit nicht verfügbar.</p>
        </f:else>
    </f:if>
</div>

</html>
