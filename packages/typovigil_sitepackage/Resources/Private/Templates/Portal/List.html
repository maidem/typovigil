<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<!-- No f:layout: Layouts/ holds page layouts only, and a plugin rendered into a
     content element brings its own markup. -->
<div class="tv-portal">
        <h1>Your TYPO3 installations</h1>

        <f:if condition="{projects}">
            <f:then>
                <ul class="tv-projects">
                    <f:for each="{projects}" as="project">
                        <li class="tv-project tv-project--{project.worstSeverity}">
                            <f:link.action action="show" arguments="{project: project.uid}" class="tv-project__link">
                                <span class="tv-project__title">{project.title}</span>

                                <span class="tv-project__state">
                                    <f:switch expression="{project.worstSeverity}">
                                        <f:case value="critical">Security update required</f:case>
                                        <f:case value="outdated">Updates available</f:case>
                                        <f:defaultCase>Up to date</f:defaultCase>
                                    </f:switch>
                                </span>

                                <f:if condition="{project.isStale}">
                                    <span class="tv-project__stale" title="No report received recently">
                                        status may be outdated
                                    </span>
                                </f:if>
                            </f:link.action>
                        </li>
                    </f:for>
                </ul>
            </f:then>
            <f:else>
                <p class="tv-empty">
                    No installations are assigned to your account yet.
                </p>
            </f:else>
        </f:if>
</div>

</html>
