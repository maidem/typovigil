# TypoVigil update workflow.
#
# Copy this file to .github/workflows/typovigil-update.yml in every repository
# TypoVigil should be able to update. The hub starts it through the GitHub API
# and passes the packages it found an update for; the actual work happens here,
# in the project's own repository, so composer.lock stays in git and a local
# ddev copy catches up with a plain `git pull`.
#
# Requirements in the repository:
#   Settings → Actions → General → Workflow permissions
#     - "Read and write permissions"
#     - "Allow GitHub Actions to create and approve pull requests"
# No secret is needed: the automatic GITHUB_TOKEN covers both the push and the
# pull request. The token the *hub* uses to start this workflow lives on the
# hub (TYPOVIGIL_GITHUB_TOKEN), not here.

name: TypoVigil update

on:
    workflow_dispatch:
        inputs:
            packages:
                description: 'Space-separated composer names, empty for all'
                required: false
                default: ''

permissions:
    contents: write
    pull-requests: write

jobs:
    update:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  # Match the version the project actually runs on, otherwise
                  # composer resolves against the wrong platform requirements.
                  php-version: '8.4'

            - name: Update the requested packages
              id: update
              env:
                  PACKAGES: ${{ inputs.packages }}
              run: |
                  set -euo pipefail

                  # --with-dependencies: a package rarely updates alone, and
                  # refusing to move its requirements is how these runs end in
                  # an unsolvable conflict instead of a pull request.
                  composer update $PACKAGES \
                      --with-dependencies \
                      --no-interaction \
                      --no-scripts

                  if git diff --quiet composer.lock; then
                      echo "changed=no" >> "$GITHUB_OUTPUT"
                  else
                      echo "changed=yes" >> "$GITHUB_OUTPUT"
                  fi

            - name: Summarise the change
              if: steps.update.outputs.changed == 'yes'
              id: summary
              run: |
                  set -euo pipefail
                  # The lock diff is the honest description of what this PR
                  # does — far more reliable than restating the hub's input.
                  git diff composer.lock \
                      | grep -E '^[+-]\s+"(name|version)"' \
                      | head -60 > /tmp/lockdiff.txt || true
                  echo "file=/tmp/lockdiff.txt" >> "$GITHUB_OUTPUT"

            - name: Open a pull request
              if: steps.update.outputs.changed == 'yes'
              uses: peter-evans/create-pull-request@v7
              with:
                  # A fixed branch name means a second run updates the existing
                  # pull request instead of opening a competing one.
                  branch: typovigil/update
                  title: 'TypoVigil: dependency update'
                  commit-message: 'Update dependencies (requested by TypoVigil)'
                  body: |
                      Requested by TypoVigil.

                      Packages: `${{ inputs.packages || 'all' }}`

                      Merging this changes nothing by itself — the installation
                      updates on the next deploy.
                  delete-branch: true
