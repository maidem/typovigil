# TypoVigil update workflow.
#
# Copy this file to .github/workflows/ in every repository TypoVigil should be
# able to update. Started by the hub through the GitHub API when someone
# presses "Update beauftragen" there. The update happens in the repository, so
# composer.lock stays in git — but the pull request is merged by this
# workflow itself, right after it opens: pressing the button is the approval,
# there is no separate review step. The project's own deploy workflow then
# builds and deploys as it does for any push to main.
#
# Requires in Settings → Actions → General → Workflow permissions:
#   - "Read and write permissions"
#   - "Allow GitHub Actions to create and approve pull requests"
# No secret is needed here; the hub's own token lives on the hub.

name: TypoVigil update

on:
    workflow_dispatch:
        inputs:
            findings:
                description: 'Packages TypoVigil found an update for (description only)'
                required: false
                default: ''

permissions:
    contents: write
    pull-requests: write

jobs:
    update:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  # ADJUST per project: must match .ddev/config.yaml and the
                  # composer.json platform requirement. Resolving against a
                  # different version produces a lock file the project cannot
                  # install.
                  php-version: '8.4'

            - name: Update
              id: update
              run: |
                  set -euo pipefail

                  # A full update, not the package list TypoVigil found: the
                  # TYPO3 packages pin each other to one exact version
                  # (typo3/cms-install requires typo3/cms-core 14.3.5, not
                  # ^14.3), so naming a subset makes composer refuse the whole
                  # resolution — even with --with-all-dependencies.
                  #
                  # The constraints in composer.json are what limits the
                  # change; they stay untouched, so this cannot cross a major
                  # version.
                  #
                  # --no-scripts: TYPO3's post-install scripts want a database
                  # and a writable var/, neither of which exists here.
                  composer update --no-interaction --no-scripts

                  if git diff --quiet composer.lock; then
                      echo "changed=no" >> "$GITHUB_OUTPUT"
                  else
                      echo "changed=yes" >> "$GITHUB_OUTPUT"
                  fi

            - name: Open a pull request
              if: steps.update.outputs.changed == 'yes'
              id: pr
              uses: peter-evans/create-pull-request@v7
              with:
                  # A fixed branch means a second run updates the open pull
                  # request instead of opening a competing one.
                  branch: typovigil/update
                  title: 'TypoVigil: Abhängigkeiten aktualisieren'
                  commit-message: 'Update dependencies (requested by TypoVigil)'
                  body: |
                      Von TypoVigil beauftragt und automatisch gemergt.

                      Auslösende Funde: `${{ inputs.findings || 'keine genannt' }}`

                      Aktualisiert wurde alles, was die Constraints in
                      `composer.json` zulassen — die TYPO3-Pakete hängen
                      aneinander und lassen sich nicht einzeln bewegen. Was
                      sich tatsächlich ändert, steht im Diff von
                      `composer.lock`.

                      Der Merge löst den Deploy-Workflow des Projekts aus.
                  delete-branch: true

            # No review step: "Update beauftragen" on the hub already
            # required an approved AI report and a fresh backup, so pressing
            # it there IS the approval. Merging here is what makes that one
            # click actually reach the live installation.
            - name: Merge the pull request
              if: steps.update.outputs.changed == 'yes'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh pr merge "${{ steps.pr.outputs.pull-request-number }}" --squash --delete-branch
